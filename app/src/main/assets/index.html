<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="李柯璇运动打卡">
<title>李柯璇 · 运动打卡</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --pos:#059669; --pos-bg:#ecfdf5;
    --neg:#dc2626; --neg-bg:#fef2f2; --brand:#4f46e5; --brand-ink:#ffffff;
    --warn:#b45309; --warn-bg:#fffbeb;
    --radius:16px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5;
    padding:calc(12px + var(--safe-t)) 14px calc(96px + var(--safe-b));
    max-width:560px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex;align-items:baseline;gap:8px;margin:2px 0 14px}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;color:var(--sub)}

  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line)}

  /* 顶部金额 */
  .hero{background:linear-gradient(150deg,#4f46e5,#7c3aed);color:#fff;border:0;padding:18px 16px}
  .hero .label{font-size:12.5px;opacity:.85;letter-spacing:.3px}
  .hero .amount{font-size:42px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
  .hero .amount small{font-size:18px;font-weight:600;margin-right:2px;opacity:.9}
  .hero .meta{display:flex;gap:16px;font-size:12.5px;opacity:.9;flex-wrap:wrap;margin-top:8px}
  .hero .meta b{font-weight:700}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stats .cell{background:var(--bg);border-radius:12px;padding:10px 4px}
  .stats .cell .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .stats .cell .t{font-size:11.5px;color:var(--sub);margin-top:1px}

  /* 月份切换 */
  .monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .monthbar .m{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .nav{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
       font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav:active{background:var(--line)}
  .nav[disabled]{opacity:.32;cursor:not-allowed}

  /* 星期头 */
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
  .wk div{text-align:center;font-size:11.5px;color:var(--sub);font-weight:600;padding:2px 0}
  .wk div.we{color:#c2410c}

  /* 日历 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .day{position:relative;aspect-ratio:1/1;border-radius:12px;background:var(--bg);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-size:14.5px;font-weight:600;cursor:pointer;border:1.5px solid transparent;
       font-variant-numeric:tabular-nums;user-select:none}
  .day .dnum{line-height:1}
  .day .dtag{font-size:9.5px;font-weight:700;margin-top:2px;line-height:1}
  .day.blank{background:transparent;cursor:default;pointer-events:none}
  .day.future{opacity:.35;cursor:default}
  .day.out{opacity:.22;pointer-events:none}
  /* 已打卡 */
  .day.done{background:var(--pos-bg);color:var(--pos);border-color:var(--pos)}
  .day.done .dtag{color:var(--pos)}
  /* 漏打卡（可补） */
  .day.miss{background:var(--neg-bg);color:var(--neg);border-color:var(--neg)}
  .day.miss .dtag{color:var(--neg)}
  /* 今天待打卡：还没过完，可打 */
  .day.wait{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);border-style:dashed}
  .day.wait .dtag{color:var(--warn)}
  /* 今天 */
  .day.today{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,70,229,.18)}
  .day.today::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
  /* 补打标记 */
  .day.backfill::before{content:"补";position:absolute;top:2px;left:4px;font-size:8.5px;
       color:#fff;background:var(--warn);border-radius:4px;padding:0 2px;line-height:11px;font-weight:700}
  .day:active{transform:scale(.94)}
  .day.done:active,.day.miss:active{background:var(--line)}

  .legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--sub)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}
  .lg-done{background:var(--pos-bg);border:1.5px solid var(--pos)}
  .lg-miss{background:var(--neg-bg);border:1.5px solid var(--neg)}
  .lg-today{border:1.5px solid var(--brand)}
  .lg-wait{background:var(--warn-bg);border:1.5px dashed var(--warn)}

  h2.sec{font-size:13px;color:var(--sub);font-weight:700;margin:0 0 10px;letter-spacing:.4px}

  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink)}
  .row .v{color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
  .row .v input{width:96px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;
       font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink)}
  .row .v input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:#fff}

  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);
       font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn:active{opacity:.82}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .btn.danger{background:var(--neg-bg);color:var(--neg);border:1px solid var(--neg)}
  .btn:disabled{opacity:.4}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* 历史结算 */
  .hist{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--card)}
  .hist .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .hist .ym{font-weight:700;font-size:14.5px}
  .hist .net{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--sub)}
  .hist .detail{font-size:12px;color:var(--sub);line-height:1.7}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:2px}
  .badge.settled{background:#e0e7ff;color:#3730a3}
  .badge.open{background:var(--warn-bg);color:var(--warn)}

  .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
         padding:8px 18px calc(20px + var(--safe-b));max-height:82vh;overflow-y:auto}
  .sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:17px}
  .sheet .desc{font-size:13px;color:var(--sub);margin-bottom:16px}
  .sheet .acts{display:grid;gap:9px}

  .toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(14px);
     background:rgba(17,24,39,.93);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
     opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .calhead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
  .calhead .m{font-weight:700;font-size:14px}
  .calhead button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
     font-size:14px;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>李柯璇 · 运动打卡</h1>
  <span class="sub">每自然日一次</span>
</header>

<!-- 本月概览 -->
<div class="card hero">
  <div class="label" id="heroLabel">本月净额（进行中）</div>
  <div class="amount" id="heroAmt"><small>¥</small>0</div>
  <div class="meta">
    <span>已打卡 <b id="mDone">0</b> 天</span>
    <span>漏打 <b id="mMiss">0</b> 天</span>
    <span>待打卡 <b id="mPend">0</b> 天</span>
    <span>累计 <b id="totalAll">¥0</b></span>
  </div>
</div>

<!-- 本月日历 -->
<div class="card">
  <div class="monthbar">
    <button class="nav" id="prevM" aria-label="上一月">‹</button>
    <div class="m" id="curM">2026年10月</div>
    <button class="nav" id="nextM" aria-label="下一月">›</button>
  </div>
  <div class="wk"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div><div class="we">日</div></div>
  <div class="cal" id="cal"></div>
  <div class="legend">
    <span><i class="lg-done"></i>已打卡 +30</span>
    <span><i class="lg-miss"></i>漏打卡 −30（可补打）</span>
    <span><i class="lg-wait"></i>今天待打卡</span>
  </div>
  <div class="note" id="calNote"></div>
</div>

<!-- 操作 -->
<div class="card">
  <h2 class="sec">操作</h2>
  <div class="acts">
    <button class="btn" id="btnToday">今日打卡 +30</button>
    <button class="btn ghost" id="btnFill">补打卡（选漏掉的日子）</button>
    <div class="btnrow">
      <button class="btn ghost" id="btnSettle">本月结算</button>
      <button class="btn ghost" id="btnSettings">设置</button>
    </div>
  </div>
</div>

<!-- 历史结算 -->
<div class="card">
  <h2 class="sec">月度结算记录</h2>
  <div id="hist"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 结算弹层 -->
<div class="mask" id="mSettle"><div class="sheet">
  <div class="grab"></div>
  <h3 id="stTitle">本月结算</h3>
  <div class="desc" id="stDesc"></div>
  <div id="stBody"></div>
  <div class="acts" style="margin-top:16px">
    <button class="btn" id="stOk">确认结算</button>
    <button class="btn ghost" id="stCancel">再想想</button>
  </div>
</div></div>

<!-- 补打弹层 -->
<div class="mask" id="mFill"><div class="sheet">
  <div class="grab"></div>
  <h3>补打卡</h3>
  <div class="desc">选择漏掉的日子补打，每补一天 +30</div>
  <div class="calhead">
    <button id="fPrev">‹</button><div class="m" id="fMonth"></div><button id="fNext">›</button>
  </div>
  <div class="wk"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div><div class="we">日</div></div>
  <div class="cal" id="fCal"></div>
  <div class="acts" style="margin-top:16px">
    <button class="btn" id="fOk">补齐本月全部漏打</button>
    <button class="btn ghost" id="fCancel">关闭</button>
  </div>
</div></div>

<!-- 设置弹层 -->
<div class="mask" id="mSet"><div class="sheet">
  <div class="grab"></div>
  <h3>设置</h3>
  <div class="desc">改完立刻生效，历史记录不受影响</div>
  <div class="row"><span class="k">打卡人</span><span class="v"><input id="sName" type="text" maxlength="12"></span></div>
  <div class="row"><span class="k">每日金额（元）</span><span class="v"><input id="sAmt" type="number" min="0" step="1"></span></div>
  <div class="row"><span class="k">起始日期</span><span class="v"><input id="sStart" type="date"></span></div>
  <div class="note" id="sWarn"></div>
  <div class="acts" style="margin-top:14px">
    <button class="btn" id="setOk">保存</button>
    <div class="btnrow">
      <button class="btn ghost" id="expBtn">导出备份</button>
      <button class="btn ghost" id="impBtn">导入备份</button>
    </div>
    <button class="btn danger" id="clrBtn">清空所有数据</button>
    <button class="btn ghost" id="setCancel">关闭</button>
  </div>
  <input type="file" id="impFile" accept="application/json,.json" style="display:none">
</div></div>

<script>
(function(){
"use strict";

/* ============ 数据层 ============ */
var LS = "lke_checkin_v1";

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function parseD(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
// 严格校验：既要像日期，也要真实存在（挡掉 2026-13-99、2026-02-30 这种）
function validDay(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p = s.split("-");
  var y = +p[0], m = +p[1], d = +p[2];
  if(m < 1 || m > 12 || d < 1) return false;
  var last = new Date(y, m, 0).getDate();
  return d <= last;
}
function validYm(s){
  if(!/^\d{4}-\d{2}$/.test(s)) return false;
  var p = s.split("-");
  var m = +p[1];
  return m >= 1 && m <= 12;
}
function ymOf(s){ return s.slice(0,7); }
function mLabel(ym){
  var p = ym.split("-");
  return p[0] + "年" + (+p[1]) + "月";
}
function daysInMonth(ym){
  var p = ym.split("-");
  return new Date(+p[0], +p[1], 0).getDate();
}
function firstDow(ym){ //周一=0
  var p = ym.split("-");
  return (new Date(+p[0], +p[1]-1, 1).getDay() + 6) % 7;
}
function addMonths(ym, n){
  var p = ym.split("-");
  var d = new Date(+p[0], +p[1]-1+n, 1);
  return d.getFullYear() + "-" + pad(d.getMonth()+1);
}

var DEF = {
  name: "李柯璇",
  amount: 30,
  start: todayStr(),
  days: {},        // {"2026-10-06": {done:1, at:ts}}
  settled: {}      // {"2026-10": {done:n, miss:n, net:n, at:ts, amount:30}}
};

var S = load();

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    var o = JSON.parse(raw);
    // 洗数据：任何一条脏记录都不许污染统计
    var days = {};
    if(o.days && typeof o.days === "object"){
      for(var k in o.days){
        if(!validDay(k)) continue;
        var v = o.days[k];
        if(v && v.done) days[k] = {done:1, at:(typeof v.at === "number" ? v.at : Date.now())};
      }
    }
    var settled = {};
    if(o.settled && typeof o.settled === "object"){
      for(var ym in o.settled){
        if(!validYm(ym)) continue;
        var r = o.settled[ym];
        if(!r || typeof r !== "object") continue;
        if(typeof r.net !== "number" || !isFinite(r.net)) continue;
        settled[ym] = {
          done:  num(r.done), miss: num(r.miss), total: num(r.total),
          pending: num(r.pending), net: r.net,
          amount: num(r.amount, 30), at: num(r.at, Date.now())
        };
      }
    }
    function num(v, dflt){ var n = parseFloat(v); return (isFinite(n) ? n : (dflt||0)); }
    return {
      name: (typeof o.name === "string" && o.name.trim()) ? o.name.trim() : DEF.name,
      amount: (typeof o.amount === "number" && isFinite(o.amount) && o.amount >= 0) ? o.amount : 30,
      start: validDay(o.start||"") ? o.start : DEF.start,
      days: days,
      settled: settled
    };
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ toast("保存失败：存储空间可能已满"); }
}

/* ============ 统计 ============ */
// 某月统计：只有 [start, min(月末, 今天)] 区间的自然日计入
// 今天若未打卡，记为「待打卡」——不算漏打（这天还没过完），也不算打卡
function statOf(ym){
  var t = todayStr();
  var ymd = ym + "-" + pad(daysInMonth(ym));
  var lo = S.start > ym + "-01" ? S.start : ym + "-01";
  var hi = t < ymd ? t : ymd;   // 未来的日子不算漏打
  var done = 0, miss = 0, total = 0, pending = 0, missList = [];
  if(hi < lo){ return {done:0, miss:0, total:0, pending:0, net:0, missList:[], past:true, future:true}; }
  for(var d = parseD(lo); fmt(d) <= hi; d.setDate(d.getDate()+1)){
    total++;
    var k = fmt(d);
    if(S.days[k] && S.days[k].done){ done++; }
    else if(k === t){ pending++; }        // 今天还没过完，不算漏打
    else { miss++; missList.push(k); }
  }
  var net = (done - miss) * S.amount;
  return {done:done, miss:miss, total:total, pending:pending, net:net, missList:missList,
          past: hi === ymd, future:false};
}
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function isDone(d){ return !!(S.days[d] && S.days[d].done); }

function totalAllNet(){
  var ym = ymOf(todayStr());
  var sum = 0;
  // 已结算的月份（脏数据跳过，不让一条坏记录毁掉整个累计）
  for(var k in S.settled){
    if(k === ym) continue;
    var r = S.settled[k];
    if(r && typeof r.net === "number" && isFinite(r.net)) sum += r.net;
  }
  // 当前月实时
  sum += statOf(ym).net;
  return sum;
}

/* ============ 渲染 ============ */
var viewYM = ymOf(todayStr());
var $ = function(id){ return document.getElementById(id); };

function render(){
  var ym = viewYM, st = statOf(ym);
  var isCur = ym === ymOf(todayStr());
  var settled = S.settled[ym];

  $("curM").textContent = mLabel(ym);
  $("prevM").disabled = ym <= ymOf(S.start);
  $("nextM").disabled = ym >= ymOf(todayStr());

  $("heroLabel").textContent = settled ? (mLabel(ym)+" 已结算") : (mLabel(ym)+" 净额（进行中）");
  setAmt($("heroAmt"), settled ? settled.net : st.net);
  $("mDone").textContent = settled ? settled.done : st.done;
  $("mMiss").textContent = settled ? settled.miss : st.miss;
  $("mPend").textContent = st.pending;
  $("totalAll").textContent = "¥" + totalAllNet();

  // 日历
  var cal = $("cal"); cal.innerHTML = "";
  var blank = firstDow(ym);
  for(var i=0;i<blank;i++){ var b=document.createElement("div"); b.className="day blank"; cal.appendChild(b); }
  var n = daysInMonth(ym), t = todayStr();
  for(var d=1; d<=n; d++){
    var key = ym + "-" + pad(d);
    var el = document.createElement("div");
    var cls = "day";
    var before = key < S.start;
    var isFut = key > t;
    if(before){ cls += " out"; }
    else if(isFut){ cls += " future"; }
    else if(isDone(key)){ cls += " done"; }
    else if(key === t){ cls += " wait"; }
    else { cls += " miss"; }
    if(key === t) cls += " today";
    if(isDone(key) && S.days[key].at && S.days[key].at < startOfDayTs(key)) cls += " backfill";
    el.className = cls;
    el.innerHTML = '<span class="dnum">'+d+'</span><span class="dtag">'
      + (before||isFut ? "" : (isDone(key) ? "+" : (key === t ? "待" : "−"))) + '</span>';
    if(!before && !isFut){
      (function(k){ el.addEventListener("click", function(){ toggleDay(k); }); })(key);
    }
    cal.appendChild(el);
  }

  // 说明
  var note = "";
  if(!settled && st.miss > 0){
    note = "本月还有 <b>"+st.miss+"</b> 天没打卡（共 −"+st.miss*S.amount+" 元），点漏掉的日子或「补打卡」可以补回来。";
  }else if(settled){
    note = "本月已结算。"+st.done+" 天打卡 / "+st.total+" 天应打，净额 "+(settled.net>=0?"+":"")+settled.net+" 元。";
  }else{
    note = "本月全部打卡，保持住。";
  }
  $("calNote").innerHTML = note;

  // 今日按钮
  var tb = $("btnToday");
  if(t < S.start){ tb.disabled = true; tb.textContent = "尚未到起始日期"; }
  else if(isDone(t)){ tb.textContent = "今日已打卡 ✓"; tb.disabled = true; tb.style.background="#059669"; }
  else { tb.disabled = false; tb.textContent = "今日打卡 +"+S.amount; tb.style.background=""; }

  renderHist();
}

function startOfDayTs(key){ var d = parseD(key); d.setHours(0,0,0,0); return d.getTime(); }

function setAmt(el, n){
  var sign = n > 0 ? "+" : (n < 0 ? "−" : "");
  el.innerHTML = '<small>¥</small>' + sign + Math.abs(n);
  el.style.color = n < 0 ? "#fecaca" : "#fff";
}

function renderHist(){
  var box = $("hist");
  var keys = Object.keys(S.settled).sort().reverse();
  var cur = ymOf(todayStr());
  var html = "";
  for(var i=0;i<keys.length;i++){
    var ym = keys[i], r = S.settled[ym];
    if(!r || typeof r.net !== "number") continue;   // 双保险，跳过脏条目
    var cls = r.net > 0 ? "pos" : (r.net < 0 ? "neg" : "zero");
    var sign = r.net > 0 ? "+" : (r.net < 0 ? "−" : "");
    html += '<div class="hist">'
      + '<div class="top"><div class="ym">'+mLabel(ym)
      +   '<span class="badge settled">已结算</span></div>'
      +   '<div class="net '+cls+'">'+sign+Math.abs(r.net)+' 元</div></div>'
      + '<div class="detail">打卡 '+r.done+' 天 · 漏打 '+r.miss+' 天 · 共 '+r.total+' 天<br>'
      + '结算于 '+new Date(r.at).toLocaleString("zh-CN",{hour12:false})+' · 当时单价 '+r.amount+' 元/天</div>'
      + '</div>';
  }
  // 当前月未结算也列一条
  var st = statOf(cur);
  var cls2 = st.net > 0 ? "pos" : (st.net < 0 ? "neg" : "zero");
  var sign2 = st.net > 0 ? "+" : (st.net < 0 ? "−" : "");
  html += '<div class="hist" style="border-style:dashed">'
    + '<div class="top"><div class="ym">'+mLabel(cur)
    +   '<span class="badge open">进行中</span></div>'
    +   '<div class="net '+cls2+'">'+sign2+Math.abs(st.net)+' 元</div></div>'
    + '<div class="detail">打卡 '+st.done+' 天 · 漏打 '+st.miss+' 天 · 共 '+st.total+' 天</div>'
    + '</div>';
  box.innerHTML = html;
}

/* ============ 交互 ============ */
function toggleDay(key){
  if(key < S.start){ toast("早于起始日期，不计入"); return; }
  if(key > todayStr()){ toast("未来的日子还不能打"); return; }
  if(S.settled[ymOf(key)]){ toast("该月已结算，不能再改"); return; }
  if(isDone(key)){
    delete S.days[key];
    save(); render();
    toast("已取消打卡 −"+S.amount);
  }else{
    var backfill = new Date().setHours(0,0,0,0) > startOfDayTs(key);
    S.days[key] = {done:1, at:Date.now()};
    save(); render();
    if(backfill) toast("补打卡成功 +"+S.amount);
    else toast("打卡成功 +"+S.amount);
  }
  buzz(18);
}

$("prevM").addEventListener("click", function(){ viewYM = addMonths(viewYM,-1); render(); });
$("nextM").addEventListener("click", function(){
  if(viewYM >= ymOf(todayStr())) return;
  viewYM = addMonths(viewYM, 1); render();
});
$("btnToday").addEventListener("click", function(){
  var t = todayStr();
  if(isDone(t)) return;
  S.days[t] = {done:1, at:Date.now()};
  save(); viewYM = ymOf(t); render();
  toast("打卡成功 +"+S.amount); buzz(24);
});

/* 结算 */
$("btnSettle").addEventListener("click", function(){
  var ym = viewYM, st = statOf(ym);
  if(S.settled[ym]){ toast("该月已结算"); return; }
  if(st.future){ toast("还没到该月"); return; }
  if(ym === ymOf(todayStr()) && st.miss > 0){
    if(!confirm("本月还有 "+st.miss+" 天漏打未补，结算后将锁死不能修改。确定结算？")) return;
  }
  $("stTitle").textContent = mLabel(ym) + " 结算";
  $("stDesc").innerHTML = "每月结算一次，结算后该月数据锁定不再变动。";
  $("stBody").innerHTML =
      '<div class="row"><span class="k">应打卡天数</span><span class="v">'+st.total+' 天</span></div>'
    + (st.pending ? '<div class="row"><span class="k">今天待打卡</span><span class="v" style="color:var(--warn)">'+st.pending+' 天（不计入扣款）</span></div>' : '')
    + '<div class="row"><span class="k">已打卡</span><span class="v pos">+'+st.done+' 天 = +'+(st.done*S.amount)+' 元</span></div>'
    + '<div class="row"><span class="k">漏打卡</span><span class="v neg">−'+st.miss+' 天 = −'+(st.miss*S.amount)+' 元</span></div>'
    + '<div class="row" style="font-weight:800;font-size:16px"><span class="k">本月净额</span><span class="v '
    +   (st.net>0?"pos":st.net<0?"neg":"zero")+'">'+(st.net>0?"+":st.net<0?"−":"")+Math.abs(st.net)+' 元</span></div>'
    + (st.miss>0 ? '<div class="note" style="color:var(--warn);border-color:var(--warn-bg)">还有 '
        + st.miss + ' 天没打，结算后就不能再补了。</div>' : '')
    + (st.pending>0 ? '<div class="note" style="color:var(--warn);border-color:var(--warn-bg)">今天还没打，'
        + '现在结算的话今天不计入，明天起才变成漏打。</div>' : '');
  openM("mSettle");
});
$("stOk").addEventListener("click", function(){
  var ym = viewYM, st = statOf(ym);
  S.settled[ym] = {done:st.done, miss:st.miss, total:st.total, pending:st.pending, net:st.net, amount:S.amount, at:Date.now()};
  save(); closeM("mSettle"); render();
  toast(mLabel(ym)+" 已结算："+(st.net>=0?"+":"")+st.net+" 元");
  buzz(30);
});
$("stCancel").addEventListener("click", function(){ closeM("mSettle"); });

/* 补打卡 */
var fillYM = null;
$("btnFill").addEventListener("click", openFill);
function openFill(){
  fillYM = ymOf(todayStr());
  if(S.settled[viewYM]) fillYM = viewYM;
  renderFill(); openM("mFill");
}
$("fPrev").addEventListener("click", function(){
  var n = addMonths(fillYM,-1);
  if(n < ymOf(S.start)) return;
  fillYM = n; renderFill();
});
$("fNext").addEventListener("click", function(){
  var n = addMonths(fillYM,1);
  if(n > ymOf(todayStr())) return;
  fillYM = n; renderFill();
});
$("fOk").addEventListener("click", function(){
  if(!fillYM){ toast("请先选择月份"); return; }
  var st = statOf(fillYM);
  if(S.settled[fillYM]){ toast("该月已结算"); return; }
  if(st.miss === 0){ toast("本月没有漏打的了"); return; }
  for(var i=0;i<st.missList.length;i++){ S.days[st.missList[i]] = {done:1, at:Date.now()}; }
  save(); closeM("mFill"); viewYM = fillYM; render();
  toast("补齐 "+st.miss+" 天，共 +"+(st.miss*S.amount)+" 元");
  buzz(30);
});
$("fCancel").addEventListener("click", function(){ closeM("mFill"); });

function renderFill(){
  if(!fillYM) return;
  $("fMonth").textContent = mLabel(fillYM);
  var st = statOf(fillYM);
  $("fOk").textContent = st.miss > 0 ? ("补齐本月全部漏打（"+st.miss+" 天 / +"+(st.miss*S.amount)+"元）")
                                      : "本月已全部打卡";
  $("fOk").disabled = st.miss === 0 || !!S.settled[fillYM];
  var cal = $("fCal"); cal.innerHTML = "";
  var blank = firstDow(fillYM);
  for(var i=0;i<blank;i++){ var b=document.createElement("div"); b.className="day blank"; cal.appendChild(b); }
  var n = daysInMonth(fillYM), t = todayStr();
  for(var d=1; d<=n; d++){
    var key = fillYM + "-" + pad(d);
    var el = document.createElement("div");
    var cls = "day";
    if(key < S.start){ cls += " out"; }
    else if(key > t){ cls += " future"; }
    else if(isDone(key)){ cls += " done"; }
    else if(key === t){ cls += " wait"; }
    else { cls += " miss"; }
    if(key === t) cls += " today";
    el.className = cls;
    el.innerHTML = '<span class="dnum">'+d+'</span><span class="dtag">'
      + ((key<S.start||key>t) ? "" : (isDone(key)?"+":(key===t?"待":"−"))) + '</span>';
    if(key >= S.start && key <= t && !S.settled[fillYM]){
      (function(k){ el.addEventListener("click", function(){
        if(isDone(k)){ delete S.days[k]; }
        else { S.days[k] = {done:1, at:Date.now()}; }
        save(); renderFill(); render(); buzz(14);
      });})(key);
    }
    cal.appendChild(el);
  }
}

/* 设置 */
$("btnSettings").addEventListener("click", function(){
  $("sName").value = S.name;
  $("sAmt").value = S.amount;
  $("sStart").value = S.start;
  $("sWarn").innerHTML = "起始日期之前的日子不计入考核。<br>改单价不影响已结算月份（它们各自记着自己的单价）。";
  openM("mSet");
});
$("setOk").addEventListener("click", function(){
  var n = $("sName").value.trim();
  var a = parseFloat($("sAmt").value);
  var st = $("sStart").value;
  if(!n){ toast("名字不能为空"); return; }
  if(!(a >= 0)){ toast("金额要填数字"); return; }
  if(!validDay(st)){ toast("起始日期不对"); return; }
  if(st > todayStr()){ toast("起始日期不能选未来"); return; }
  S.name = n; S.amount = Math.round(a*100)/100; S.start = st;
  save();
  if(viewYM < ymOf(S.start)) viewYM = ymOf(S.start);
  closeM("mSet"); render();
  toast("已保存");
});
$("setCancel").addEventListener("click", function(){ closeM("mSet"); });
$("clrBtn").addEventListener("click", function(){
  if(!confirm("会清空所有打卡与结算记录，且不可恢复。确定？")) return;
  if(!confirm("再确认一次：真的要全部清空？")) return;
  S = JSON.parse(JSON.stringify(DEF));
  save(); viewYM = ymOf(todayStr()); closeM("mSet"); render();
  toast("已清空");
});
$("expBtn").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "打卡备份-" + todayStr() + ".json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast("已导出");
});
$("impBtn").addEventListener("click", function(){ $("impFile").click(); });
$("impFile").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      if(!o || !o.days || typeof o.days !== "object") throw 0;
      // 复用 load() 的清洗逻辑，保证导入的数据也是干净的
      var backup = localStorage.getItem(LS);
      localStorage.setItem(LS, JSON.stringify(o));
      S = load();
      localStorage.setItem(LS, JSON.stringify(S));
      save();
      viewYM = ymOf(todayStr()); closeM("mSet"); render();
      toast("导入成功");
    }catch(err){ toast("文件格式不对，导入失败"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* 弹层控制 */
function openM(id){ $(id).classList.add("on"); }
function closeM(id){ $(id).classList.remove("on"); }
["mSettle","mFill","mSet"].forEach(function(id){
  $(id).addEventListener("click", function(e){ if(e.target === $(id)) closeM(id); });
});

/* Toast & 震动 */
var tTimer;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(tTimer);
  tTimer = setTimeout(function(){ el.classList.remove("on"); }, 1900);
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* 跨天自动刷新 */
var lastDay = todayStr();
setInterval(function(){
  if(todayStr() !== lastDay){
    lastDay = todayStr();
    viewYM = ymOf(lastDay);
    render();
  }
}, 30000);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  if(todayStr() !== lastDay){ lastDay = todayStr(); viewYM = ymOf(lastDay); }
  render();
});

/* 离线：注册 Service Worker（file:// 下会失败，忽略即可） */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

render();

})();
</script>
</body>
</html>
